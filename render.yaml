services:
  - type: web
    name: ai-information-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    autoDeploy: true
    healthCheckPath: /
